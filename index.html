<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChronoChroma</title>
  <style>
    @font-face {
      font-family: 'Archivo Black';
      src: url('fonts/archivo-black-v23-latin-regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Montserrat';
      src: url('fonts/montserrat-v31-latin-300.woff2') format('woff2');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Montserrat';
      src: url('fonts/montserrat-v31-latin-500.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #080808;
      --text: #ececec;
      --muted: #4e4e4e;
      --line: rgba(236, 236, 236, 0.12);
      --gutter: clamp(1rem, 4vw, 4rem);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .label {
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Top bar */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem var(--gutter);
      mix-blend-mode: difference;
    }

    .logo {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.25rem;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      color: #fff;
    }

    .header-link {
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #fff;
      position: relative;
    }

    .header-link::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -4px;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.35s ease;
    }

    .header-link:hover::after {
      transform: scaleX(1);
    }

    main {
      padding-top: 4.5rem;
    }

    /* Work */
    .work {
      padding-bottom: clamp(3rem, 8vw, 8rem);
    }

    .work-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.5rem var(--gutter) clamp(1rem, 2vw, 1.75rem);
      border-top: 1px solid var(--line);
    }

    .section-title {
      font-family: 'Archivo Black', sans-serif;
      font-weight: 400;
      font-size: clamp(1.125rem, 3.5vw, 3.5rem);
      line-height: 0.9;
      letter-spacing: -0.04em;
      text-transform: uppercase;
    }

    .frame {
      margin: 0 var(--gutter);
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: clamp(6px, 1vw, 14px);
      overflow: hidden;
    }

    .frame video,
    .frame iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      object-fit: cover;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--line);
      padding: clamp(3rem, 7vw, 6rem) var(--gutter) 1.75rem;
    }

    .contact {
      display: block;
      font-family: 'Archivo Black', sans-serif;
      font-size: clamp(1rem, 2.95vw, 3.75rem);
      line-height: 1;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      margin: 0 0 clamp(3rem, 7vw, 6rem);
      white-space: nowrap;
      transition: color 0.3s ease;
    }

    .contact:hover {
      color: var(--muted);
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
    }

    /* Scroll reveal */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    .reveal.in {
      opacity: 1;
      transform: none;
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .reveal { opacity: 1; transform: none; transition: none; }
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="#">ChronoChroma</a>
    <a class="header-link" href="#contact">Contact</a>
  </header>

  <main>
    <section class="work">
      <div class="work-head reveal">
        <h2 class="section-title">Latest</h2>
        <span class="label">01</span>
      </div>
      <div class="frame reveal">
        <video controls playsinline preload="metadata" poster="https://image.mux.com/RAR61mC5imgw5p55i35xOr01t9UKgj225Iq66MvXV18U/thumbnail.jpg">
          <source src="https://stream.mux.com/RAR61mC5imgw5p55i35xOr01t9UKgj225Iq66MvXV18U/720p.mp4" type="video/mp4" />
        </video>
      </div>
    </section>

    <section class="work">
      <div class="work-head reveal">
        <h2 class="section-title">More</h2>
        <span class="label">02</span>
      </div>
      <div class="frame reveal">
        <iframe
          src="https://www.youtube.com/embed/qNJJxU45P1A?rel=0&modestbranding=1&color=white"
          title="More"
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>
    </section>
  </main>

  <footer id="contact">
    <a class="contact" href="mailto:info@chronochroma.ai">info@chronochroma.ai</a>
    <div class="footer-row">
      <span class="label">&copy; 2026 ChronoChroma</span>
      <span class="label">All Rights Reserved</span>
    </div>
  </footer>

  <script>
    const items = document.querySelectorAll('.reveal');
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            e.target.classList.add('in');
            io.unobserve(e.target);
          }
        });
      }, { threshold: 0.12 });
      items.forEach((el) => io.observe(el));
    } else {
      items.forEach((el) => el.classList.add('in'));
    }
  </script>

</body>
</html>
