<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChronoChroma</title>
  <style>
    @font-face {
      font-family: 'Archivo Black';
      src: url('fonts/archivo-black-v23-latin-regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Montserrat';
      src: url('fonts/montserrat-v31-latin-300.woff2') format('woff2');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Montserrat';
      src: url('fonts/montserrat-v31-latin-500.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
  </style>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #080808;
      color: #4e4e4e;
      font-family: 'Montserrat', sans-serif;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.035;
      pointer-events: none;
      z-index: 100;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 2.4rem 4rem;
      border-bottom: 1px solid #4e4e4e;
      gap: 0.4rem;
    }

    .logo {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      text-decoration: none;
      color: #4e4e4e;
    }

    .logo .chrono {
      color: #4e4e4e;
    }

    .logo .chroma {
      color: #4e4e4e;
    }

    .tagline {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #4e4e4e;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 5rem 4rem 4rem;
    }

    .video-container {
      width: 100%;
      max-width: 1100px;
      position: relative;
    }

    .video-container::before,
    .video-container::after {
      content: '';
      position: absolute;
      background: #4e4e4e;
      opacity: 0.3;
    }

    .video-container::before {
      top: -12px;
      left: 0;
      right: 0;
      height: 1px;
    }

    .video-container::after {
      bottom: -12px;
      left: 0;
      right: 0;
      height: 1px;
    }

    .video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 2rem;
      margin-top: 2rem;
      width: 100%;
      max-width: 1100px;
    }

    .meta-line {
      flex: 1;
      height: 1px;
      background: #4e4e4e;
      opacity: 0.2;
    }

    .meta-text {
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #4e4e4e;
      white-space: nowrap;
    }

    footer {
      text-align: center;
      padding: 3rem 4rem;
      font-size: 0.6rem;
      font-weight: 300;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #4e4e4e;
      border-top: 1px solid rgba(78, 78, 78, 0.5);
      margin-top: 4rem;
    }

    @media (max-width: 640px) {
      header {
        padding: 1.8rem 1.5rem;
      }

      main {
        padding: 3rem 1.5rem 2rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="#"><span class="chrono">Chrono</span><span class="chroma">Chroma</span></a>
    <p class="tagline">Story Driven. Ai Generated.</p>
  </header>

  <main>
    <div class="video-container">
      <div class="video-wrapper">
        <iframe
          src="https://www.youtube.com/embed/qNJJxU45P1A?rel=0&modestbranding=1&color=white"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>
    </div>

    <div class="meta">
      <div class="meta-line"></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:0.5rem;">
        <span class="meta-text">ChronoChroma</span>
        <a href="mailto:info@chronochroma.ai" class="meta-text" style="color:#4e4e4e;text-decoration:none;">info@chronochroma.ai</a>
      </div>
      <div class="meta-line"></div>
    </div>
  </main>

  <footer>
    &copy; 2026 ChronoChroma &mdash; All Rights Reserved
  </footer>

</body>
</html>
